name: TrueSentry CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Workspace Packages
        run: npm run build

      - name: TypeScript Typecheck
        run: npm run type-check

      - name: Run Test Suite
        run: npm test

      - name: Verify Build
        run: npm run build
